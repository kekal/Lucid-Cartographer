services:
  cartographer:
    build:
      context: .
      args:
        # Run the container as the host user that owns ./data (NAS PUID/PGID),
        # so it can write the SQLite DB and OAuth keys. Override in .env.
        PUID: ${PUID:-1026}
        PGID: ${PGID:-100}
    ports:
      - "5087:8080"
    volumes:
      # Host folder is tracked (appdata/.gitkeep) so it exists after a clone/pull.
      # Named "appdata" (not "data") to avoid colliding with the source Data/ folder
      # on case-insensitive filesystems.
      - ./appdata:/data
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Seeds the "admin" account on the FIRST run only (empty user database).
      # Startup fails fast if this is blank and no users exist yet.
      - Auth__InitialAdminPassword=${ADMIN_PASSWORD:-}
      # Key remote MCP clients (e.g. Claude Code) must present as
      # "Authorization: Bearer <key>" or "X-Api-Key: <key>". Blank = remote MCP
      # disabled (fail-closed); in Production the LAN bypass is off too.
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Public https base URL (e.g. https://maps.example.com). Enables the OAuth
      # frontdoor so Claude.ai connectors can self-register and sign in. Blank =
      # OAuth disabled (MCP via MCP_API_KEY only). Behind the tunnel you must also
      # set Auth__TrustedProxies__0 to the tunnel's source IP (see README).
      - OAuth__Issuer=${PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
