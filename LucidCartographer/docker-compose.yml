services:
  cartographer:
    build:
      context: .
      args:
        # Run the container as the host user that owns ./data (NAS PUID/PGID),
        # so it can write the SQLite DB and OAuth keys. Override in .env.
        PUID: ${PUID:-1026}
        PGID: ${PGID:-100}
    # Stable hostname so the persisted Chrome profile's singleton lock always
    # matches the current container (lets Chromium self-recover a stale lock
    # instead of seeing "in use by another computer" after a recreate).
    hostname: cartographer
    ports:
      - "5087:8080"
    volumes:
      # Host folder is tracked (appdata/.gitkeep) so it exists after a clone/pull.
      # Named "appdata" (not "data") to avoid colliding with the source Data/ folder
      # on case-insensitive filesystems.
      - ./appdata:/data
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Seeds the "admin" account on the FIRST run only (empty user database).
      # Startup fails fast if this is blank and no users exist yet.
      - Auth__InitialAdminPassword=${ADMIN_PASSWORD:-}
      # Key remote MCP clients (e.g. Claude Code) must present as
      # "Authorization: Bearer <key>" or "X-Api-Key: <key>". Blank = remote MCP
      # disabled (fail-closed); in Production the LAN bypass is off too.
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Public https base URL (e.g. https://maps.example.com). Enables the OAuth
      # frontdoor so Claude.ai connectors can self-register and sign in. Blank =
      # OAuth disabled (MCP via MCP_API_KEY only).
      - OAuth__Issuer=${PUBLIC_URL:-}
      # Networks (CIDR) allowed to set X-Forwarded-Proto/For. Behind the tunnel
      # the request reaches the container from a Docker bridge gateway, so the
      # forwarded https scheme is only honored if that gateway is trusted here.
      # The private ranges cover all Docker bridge subnets; the container is only
      # reachable via the tunnel and LAN, so trusting RFC1918 is safe. Without
      # this the OAuth endpoints see http and reject with "only accepts HTTPS".
      - Auth__TrustedNetworks__0=172.16.0.0/12
      - Auth__TrustedNetworks__1=10.0.0.0/8
      - Auth__TrustedNetworks__2=192.168.0.0/16
      # --- OPTIONAL: Valhalla measured travel times (Epic 2, AD-8) -----------
      # Uncomment to flip the active provider to the self-hosted Valhalla engine
      # defined under the "valhalla" compose profile below. ONE engine serves all
      # ground modes via dynamic costing (Drive->auto, Walk->pedestrian,
      # Cycle->bicycle) — no per-mode backends. Start it with:
      #   docker compose --profile valhalla up
      # and pick your region with the single `tile_urls` env var on the valhalla
      # service (set VALHALLA_TILE_URLS in .env). On first start it downloads the
      # .pbf and BUILDS tiles; during that window routing is temporarily Estimated
      # (smart-haversine) and self-heals to Measured once tiles finish and the
      # background pass re-attempts (FR-13a). NFR7: Valhalla is self-hosted, so
      # stop coordinates never leave the deployment (the only out-call is the
      # build-time .pbf fetch). NFR8: enabling Valhalla brings the OSM/ODbL
      # attribution obligation (surfaced via provider.Attribution).
      - TravelTime__Provider=Valhalla
      - TravelTime__Valhalla__BaseUrl=http://valhalla:8002
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- OPTIONAL Valhalla measured-routing engine (Epic 2, AD-8) -------------
  # Gated behind the "valhalla" compose profile, so the default `docker compose
  # up` (the Mock/smart-haversine deployment) starts NONE of it. Enable with:
  #   docker compose --profile valhalla up
  # ONE engine serves all ground modes via dynamic costing (Drive->auto,
  # Walk->pedestrian, Cycle->bicycle) — no per-profile sidecars, no manual
  # extract/partition/customize. On first start (and whenever the .pbf changes)
  # it auto-DOWNLOADS the region extract from `tile_urls` and auto-BUILDS tiles
  # into ./appdata/valhalla (mapped to /custom_files). DURING THAT BUILD WINDOW
  # Valhalla is UNREACHABLE and ground legs degrade to smart-haversine
  # (Estimated) — the app self-heals to Measured once tiles finish and the
  # background pass re-attempts (FR-13a). Image is IMMUTABLY PINNED to a specific
  # version tag, NEVER :latest (AD-8, OQ-7). NFR7: the ONLY outbound access is
  # this build-time .pbf fetch; routing requests never leave the internal compose
  # network, so stop coordinates never egress.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    ports:
      # Published so the app reaches it at http://valhalla:8002 over the internal
      # compose network (ValhallaOptions.BaseUrl default) and an operator can
      # reach :8002 on the host. Port is NON-NEGOTIABLE — it must match the app's
      # default BaseUrl.
      - "8002:8002"
    volumes:
      # Persists built tiles across recreates so the multi-minute build is paid
      # once, not on every `up`. The image auto-rebuilds when the source .pbf
      # changes (use_tiles_ignore_pbf).
      - ./appdata/valhalla:/custom_files
    environment:
      # The SINGLE knob an operator sets to choose their region (FR-12). Point it
      # at a region extract URL (e.g. a Geofabrik .osm.pbf). Override via
      # VALHALLA_TILE_URLS in .env. No extract/partition/customize steps — the
      # image downloads and builds tiles on its own.
      - tile_urls=${VALHALLA_TILE_URLS:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
      # Reuse already-built tiles when present (skip rebuild unless the .pbf
      # changes); keep the tile tar so a recreate restarts fast.
      - use_tiles_ignore_pbf=True
      - build_tar=True
      - server_threads=2
    restart: unless-stopped
    # The build window is operator-visible: until tiles are built and the engine
    # answers, /status fails and the service shows "starting"/"unhealthy" in
    # `docker compose ps`, while `docker compose logs valhalla` streams the
    # image's own tile-build progress. During this window the app routes
    # Estimated and self-heals to Measured once healthy (FR-13a). start_period
    # must comfortably cover a region tile build (minutes→tens of minutes by
    # region size — OQ-3, measured by the operator during first boot).
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
